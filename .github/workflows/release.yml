name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PAT }}

  # TODO: Re-enable E2E tests before publishing
  # e2e-tests:
  #   needs: release-please
  #   if: ${{ needs.release-please.outputs.release_created }}
  #   uses: ./.github/workflows/e2e.yml
  #   secrets:
  #     TOKEN_SOURCE_API_KEY: ${{ secrets.TOKEN_SOURCE_API_KEY }}
  #     RECAPTCHA_API_KEY: ${{ secrets.RECAPTCHA_API_KEY }}

  publish:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@getvrex"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish SDK to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Sync CLI package version with SDK and publish
      - name: Publish CLI to npm
        run: |
          cd packages/cli
          npm version --no-git-tag-version $(node -p "require('../../package.json').version")
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
